name: Public repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select public checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.plan.outputs.run_checks }}
      run_code_checks: ${{ steps.plan.outputs.run_code_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Classify the complete change
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/public-ci.mjs plan

  documentation:
    name: Documentation checks
    needs: plan
    if: ${{ needs.plan.outputs.run_checks == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            git show --format= --check HEAD
          else
            git diff --check "$BASE_SHA" HEAD
          fi
      - name: Check local documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress '*.md' 'docs/readme/*.md' '.github/**/*.md'
          lycheeVersion: v0.24.2
          fail: true
          token: ""
          output: ${{ runner.temp }}/lychee-report.md

  frontend:
    name: Frontend checks (shard ${{ matrix.shard }})
    needs: plan
    if: ${{ needs.plan.outputs.run_code_checks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run dependency and architecture checks
        if: matrix.shard == 1
        run: pnpm verify:dependencies && pnpm architecture:check
      - name: Typecheck
        if: matrix.shard == 1
        run: pnpm typecheck
      - name: Lint
        if: matrix.shard == 1
        run: pnpm lint
      - name: Dependency cruiser
        if: matrix.shard == 1
        run: pnpm depcruise
      - name: Knip unused exports
        if: matrix.shard == 1
        run: pnpm knip
      - name: Test frontend source (shard ${{ matrix.shard }}/3)
        run: pnpm test:src --shard=${{ matrix.shard }}/3
      - name: Test frontend contracts
        if: matrix.shard == 1
        run: pnpm test:frontend-contracts
      - name: Build frontend
        if: matrix.shard == 1
        run: pnpm build:frontend

  scripts-setup:
    name: Prepare script test user
    needs: plan
    if: ${{ needs.plan.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install zsh for test fixtures
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh
      - name: Prepare isolated script test user
        run: |
          sudo useradd --create-home --shell /bin/bash dure-source-checks
          sudo cp -a "$GITHUB_WORKSPACE" /home/dure-source-checks/source
          sudo chown -R dure-source-checks:dure-source-checks /home/dure-source-checks/source
          sudo install --owner=dure-source-checks --group=dure-source-checks --mode=0755 "$(command -v rustup)" /home/dure-source-checks/rustup-init
          sudo mkdir -p /home/dure-source-checks/node
          sudo cp -a "$(dirname "$(dirname "$(command -v node)")")"/* /home/dure-source-checks/node/
          sudo chown -R dure-source-checks:dure-source-checks /home/dure-source-checks/node
      - name: Setup Rust toolchain in test user home
        run: |
          sudo --user=dure-source-checks --set-home env PATH="$PATH" bash -c '
            cd "$HOME/source"
            export CARGO_HOME="$HOME/.cargo"
            export RUSTUP_HOME="$HOME/.rustup"
            "$HOME/rustup-init" -y --no-modify-path --default-toolchain none
            export PATH="$CARGO_HOME/bin:$PATH"
            rustc -vV
          '
      - name: Install pnpm dependencies
        run: |
          sudo --user=dure-source-checks --set-home bash -c '
            cd "$HOME/source"
            export PATH="$HOME/node/bin:$PATH"
            corepack enable
            pnpm install --frozen-lockfile
          '
      - name: Archive prepared test user
        run: sudo tar -czf /tmp/dure-test-user.tar.gz -C /home dure-source-checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dure-test-user-${{ github.sha }}
          path: /tmp/dure-test-user.tar.gz
          retention-days: 1

  scripts-vitest:
    name: Script checks (vitest)
    needs: [plan, scripts-setup]
    if: ${{ needs.plan.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dure-test-user-${{ github.sha }}
          path: /tmp
      - name: Restore test user
        run: |
          ls -lah /tmp/
          if [ -f /tmp/dure-test-user.tar.gz ]; then
            sudo tar -xzf /tmp/dure-test-user.tar.gz -C /home
          elif [ -f /tmp/dure-test-user-${{ github.sha }}.tar.gz ]; then
            sudo tar -xzf /tmp/dure-test-user-${{ github.sha }}.tar.gz -C /home
          else
            echo "Error: artifact tar.gz not found in /tmp"
            exit 1
          fi
          id dure-source-checks || echo "User not found after extraction!"
      - name: Run vitest script tests
        run: |
          sudo --user=dure-source-checks --set-home env PATH="$PATH" CI=true bash -c '
            cd "$HOME/source"
            export PATH="$HOME/node/bin:$PATH"
            export CARGO_HOME="$HOME/.cargo"
            export RUSTUP_HOME="$HOME/.rustup"
            export PATH="$CARGO_HOME/bin:$PATH"
            RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | awk '"'"'{print $1}'"'"')"
            export RUSTUP_TOOLCHAIN
            corepack pnpm exec vitest run --project scripts
          '

  scripts-deadline:
    name: Script checks (deadline ${{ matrix.group }})
    needs: [plan, scripts-setup]
    if: ${{ needs.plan.outputs.run_code_checks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            files: scripts/dure-cli-hmux.test.mjs scripts/dure-cli-ls.test.mjs scripts/dure-cli-orchestration-status.test.mjs scripts/dure-cli-read-latency.test.mjs scripts/dure-cli-wait.test.mjs
          - group: 2
            files: scripts/lib/dev-hmux-tool.test.mjs scripts/lib/process-identity-relations.test.mjs scripts/qa/hmux-remote-soak.test.mjs scripts/qa/lib/bounded-owned-process-group.test.mjs scripts/qa/lib/owned-process-group.test.mjs
          - group: 3
            files: scripts/qa/spawn-prompt-ssh-receipt-loss-smoke.test.mjs scripts/run-hmux-tests.preparation.test.mjs scripts/run-hmux-tests.test.mjs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dure-test-user-${{ github.sha }}
          path: /tmp
      - name: Restore test user
        run: |
          ls -lah /tmp/
          if [ -f /tmp/dure-test-user.tar.gz ]; then
            sudo tar -xzf /tmp/dure-test-user.tar.gz -C /home
          elif [ -f /tmp/dure-test-user-${{ github.sha }}.tar.gz ]; then
            sudo tar -xzf /tmp/dure-test-user-${{ github.sha }}.tar.gz -C /home
          else
            echo "Error: artifact tar.gz not found in /tmp"
            exit 1
          fi
          id dure-source-checks || echo "User not found after extraction!"
      - name: Run deadline-sensitive script tests (group ${{ matrix.group }})
        run: |
          sudo --user=dure-source-checks --set-home env PATH="$PATH" CI=true bash -c '
            cd "$HOME/source"
            export PATH="$HOME/node/bin:$PATH"
            export CARGO_HOME="$HOME/.cargo"
            export RUSTUP_HOME="$HOME/.rustup"
            export PATH="$CARGO_HOME/bin:$PATH"
            RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | awk '"'"'{print $1}'"'"')"
            export RUSTUP_TOOLCHAIN
            corepack pnpm exec vitest run ${{ matrix.files }}
          '

  scripts-process:
    name: Script checks (process ${{ matrix.group }})
    needs: [plan, scripts-setup]
    if: ${{ needs.plan.outputs.run_code_checks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: frontend-authority
            files: scripts/run-dev-app.frontend-authority.test.mjs
          - group: dev-supervisor
            files: scripts/lib/dev-launch-supervisor.test.mjs scripts/lib/dev-launch-supervisor.retirement-failure.test.mjs
          - group: queue-deploy
            files: scripts/queue-dev-app-deploy.test.mjs scripts/provision-hmux-remote.test.mjs
          - group: dev-app
            files: scripts/run-dev-app.test.mjs scripts/run-dev-frontend.test.mjs scripts/run-dev-launch-child.test.mjs
          - group: diagnostics
            files: scripts/dure-cli-diagnostics.test.mjs scripts/dure-cli-install.test.mjs scripts/dure-cli-mutation-lock.test.mjs
          - group: qa-tests
            files: scripts/lib/process-group-witness.test.mjs scripts/qa/lib/tauri-app-launch.test.mjs scripts/qa/lib/tauri-app-runner.test.mjs scripts/qa/pane-app-restart-app.test.mjs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dure-test-user-${{ github.sha }}
          path: /tmp
      - name: Restore test user
        run: |
          ls -lah /tmp/
          if [ -f /tmp/dure-test-user.tar.gz ]; then
            sudo tar -xzf /tmp/dure-test-user.tar.gz -C /home
          elif [ -f /tmp/dure-test-user-${{ github.sha }}.tar.gz ]; then
            sudo tar -xzf /tmp/dure-test-user-${{ github.sha }}.tar.gz -C /home
          else
            echo "Error: artifact tar.gz not found in /tmp"
            exit 1
          fi
          id dure-source-checks || echo "User not found after extraction!"
      - name: Run process fixture script tests (${{ matrix.group }})
        run: |
          sudo --user=dure-source-checks --set-home env PATH="$PATH" CI=true bash -c '
            cd "$HOME/source"
            export PATH="$HOME/node/bin:$PATH"
            export CARGO_HOME="$HOME/.cargo"
            export RUSTUP_HOME="$HOME/.rustup"
            export PATH="$CARGO_HOME/bin:$PATH"
            RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | awk '"'"'{print $1}'"'"')"
            export RUSTUP_TOOLCHAIN
            corepack pnpm exec vitest run ${{ matrix.files }}
          '

  mobile-web:
    name: Mobile web checks
    needs: plan
    if: ${{ needs.plan.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify mobile web source
        run: pnpm verify:push:mobile-web

  shared-protocol:
    name: Shared protocol (${{ matrix.os }})
    needs: plan
    if: ${{ needs.plan.outputs.run_code_checks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare repository-pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.2
        with:
          workspaces: crates/dure-hub-protocol
          shared-key: hub-protocol-${{ matrix.os }}
      - name: Check shared protocol formatting
        run: cargo fmt --manifest-path crates/dure-hub-protocol/Cargo.toml --all --check
      - name: Test desktop and mobile wire format
        run: cargo test --locked --manifest-path crates/dure-hub-protocol/Cargo.toml --all-targets
      - name: Lint shared protocol
        run: cargo clippy --locked --manifest-path crates/dure-hub-protocol/Cargo.toml --all-targets -- -D warnings

  hmux-cli:
    name: Hmux CLI checks (informational)
    needs: plan
    if: ${{ needs.plan.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare repository-pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.2
        with:
          workspaces: hmux
          shared-key: hmux-cli
      - name: Build hmux-cli
        run: cargo build --locked --manifest-path hmux/Cargo.toml -p hmux-cli
      - name: Test hmux-cli (excluding known failures)
        run: cargo test --locked --manifest-path hmux/Cargo.toml -p hmux-cli -- --skip attach_recovery

  public-repository:
    name: Public repository checks
    needs: [plan, documentation, frontend, scripts-vitest, scripts-deadline, scripts-process, mobile-web, shared-protocol]
    if: ${{ always() && needs.plan.outputs.run_checks != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require every selected check to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_CODE_CHECKS: ${{ needs.plan.outputs.run_code_checks }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SCRIPTS_VITEST_RESULT: ${{ needs.scripts-vitest.result }}
          SCRIPTS_DEADLINE_RESULT: ${{ needs.scripts-deadline.result }}
          SCRIPTS_PROCESS_RESULT: ${{ needs.scripts-process.result }}
          MOBILE_WEB_RESULT: ${{ needs.mobile-web.result }}
          SHARED_PROTOCOL_RESULT: ${{ needs.shared-protocol.result }}
        run: node scripts/public-ci.mjs check
