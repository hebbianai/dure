name: Release deadline diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deadline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare the same isolated source-check user
        run: |
          corepack enable
          sudo useradd --create-home --shell /bin/bash dure-source-checks
          sudo cp -a "$GITHUB_WORKSPACE" /home/dure-source-checks/source
          sudo chown -R dure-source-checks:dure-source-checks /home/dure-source-checks/source
      - name: Reproduce the unchanged deadline contract
        run: |
          sudo --user=dure-source-checks --set-home env PATH="$PATH" CI=true bash -euo pipefail <<'SCRIPT'
          cd "$HOME/source"
          pnpm install --frozen-lockfile
          pnpm exec vitest run --project scripts-deadline scripts/qa/lib/bounded-owned-process-group.test.mjs scripts/qa/lib/owned-process-group.test.mjs
          SCRIPT
