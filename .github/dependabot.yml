version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Every npm tree with its own pnpm-lock.yaml that ships or builds the
  # product: the desktop frontend and its tooling, the CLI, the mobile client
  # and the control-plane claude driver staged into the desktop app.
  - package-ecosystem: npm
    directories:
      - /
      - /cli
      - /mobile
      - /crates/dure-app/control-plane/provider-drivers/claude
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The mobile client type-checks against the desktop's generated
      # terminal-state code, and protoc-gen-es requires the exact
      # @bufbuild/protobuf release it generates for, so every @bufbuild
      # package moves together in both trees. After a protoc-gen-es bump,
      # regenerate with `pnpm terminal-state-protocol:generate`.
      bufbuild:
        patterns:
          - "@bufbuild/*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # See the matching Tauri rule in the cargo entry below.
      - dependency-name: "@tauri-apps/api"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@tauri-apps/plugin-*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  # Every Cargo workspace with its own Cargo.lock. The workspaces path-depend
  # on one another (the desktop and mobile adapters link Hmux and app-core
  # crates, and Hmux's [workspace.dependencies] reach every lockfile holding an
  # Hmux crate), so a bump has to refresh every lockfile in one change or the
  # `--locked` builds fail. Grouping by dependency name gives one pull request
  # per dependency across all of these directories. Dependabot can still leave
  # a path-dependent workspace's Cargo.lock stale, so the "Dependabot Cargo
  # lockfiles" workflow re-resolves every Cargo.lock on its pull requests. The
  # public CI "Dependency advisories" job audits the shipped lockfiles among
  # them.
  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /crates/dure-app
      - /hmux
      - /mobile/src-tauri
      - /orchestration
      - /crates/dure-relay
      - /crates/dure-hub-protocol
      - /crates/dure-feedback-intake
      - /crates/hebbian-bounded-process
      - /crates/hebbian-process-sampler
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-across-workspaces:
        group-by: dependency-name
    ignore:
      # Hmux keeps its Rust 1.85 baseline (rust-version in hmux/Cargo.toml;
      # the Ghostty VT proof and the Windows Hmux clippy gate build with
      # 1.85.0). idna_adapter is pinned for that reason in hmux/Cargo.toml
      # (1.2.2 requires Rust 1.86), and uuid 1.27 and later require Rust 1.89.
      - dependency-name: idna_adapter
      - dependency-name: uuid
        versions:
          - ">= 1.27"
      # sha2 0.11 and hmac 0.13 move to digest 0.11, whose hash outputs no
      # longer format with `{:x}`; ~180 call sites need a hand migration.
      - dependency-name: sha2
        versions:
          - ">= 0.11"
      - dependency-name: hmac
        versions:
          - ">= 0.13"
      # A Tauri crate and its @tauri-apps npm package must share a
      # major.minor release or the Tauri CLI refuses to build, and one
      # Dependabot pull request cannot span cargo and npm. Patch updates stay
      # automatic; minor and major Tauri updates are made by hand, crate and
      # npm package together.
      - dependency-name: tauri
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "tauri-plugin-*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
