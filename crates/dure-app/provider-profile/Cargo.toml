[package]
name = "dure-provider-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Native provider credential profile projection for Dure"

[dependencies]
dure-app = { path = ".." }
fs2 = "0.4"
hmux-runtime-contract = { path = "../../../hmux/crates/hmux-runtime-contract" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
