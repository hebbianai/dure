[package]
name = "dure-git-checkout"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Exact Git checkout instance authority for Dure"

[dependencies]
dure-app-protocol = { path = "../protocol" }
dunce = "1.0.5"
dirs = "6"
fs2 = "0.4"
getrandom = "0.3"
hebbian-bounded-process = { path = "../../hebbian-bounded-process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
