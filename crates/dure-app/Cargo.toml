[package]
name = "dure-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Tauri-independent application and extension contracts for Dure"

[workspace]
members = [
    "control-plane",
    "git-checkout",
    "protocol",
    "provider-adapter",
    "provider-profile",
    "session-runtime",
    "sqlite",
]
resolver = "2"

# The control plane refuses executable identities over 256 MiB, and a dev or
# test build resolves its own executable as one. Linux otherwise links the full
# DWARF of every crate into each executable, which put the debug control plane
# at about 570 MB there. Keep debug info beside the objects, as macOS already
# does by default, so both platforms stay inside that bound. This workspace's
# control plane is Unix-only; Windows MSVC builds the shared crates through
# src-tauri, whose own profile applies.
[profile.dev]
split-debuginfo = "unpacked"

# Executable identity hashes must finish within normal backend startup budgets.
# Keep SHA-256 optimized in dev/test while retaining the usual debug checks.
[profile.dev.package.sha2]
opt-level = 3

[dependencies]
dure-app-protocol = { path = "protocol" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "11", features = ["serde-compat"] }

[[bin]]
name = "export-extension-contracts"
path = "src/bin/export_extension_contracts.rs"
