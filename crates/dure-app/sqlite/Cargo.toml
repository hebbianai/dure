[package]
name = "dure-app-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "SQLite adapter for Dure durable application state"

[dependencies]
agent-orchestration = { path = "../../../orchestration" }
dure-app = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# SQLx 0.9 requires Rust 1.94, above the rust-version declared here, so this
# crate and its dependents build only with the repository-pinned toolchain.
# Features: the bundled SQLite and unlock-notify, as the 0.8 `sqlite` feature
# enabled; no extension loading or (de)serialization.
sqlx ={ version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "sqlite-unlock-notify"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
