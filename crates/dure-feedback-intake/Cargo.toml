[package]
name = "dure-feedback-intake"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Receives in-app feedback submissions and turns them into GitHub issues"

[lib]
name = "dure_feedback_intake"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"] }
base64 = "0.22"
sha2 = "0.10"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
