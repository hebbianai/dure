[package]
name = "hmux-ssh-transport"
description = "Hmux frames over an SSH exec channel, for clients that are not on the session's machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# A relay uses the transport-neutral Client API without its local runtime.
# Wire values and framed carrier traits come directly from the common contract;
# local discovery, process and socket adapters remain behind Client's feature.
hmux-client = { path = "../hmux-client", default-features = false, features = ["terminal-state-stream"] }
hmux-session-protocol = { path = "../hmux-session-protocol" }
hmux-runtime-contract = { path = "../hmux-runtime-contract" }
libc.workspace = true
russh.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
rand.workspace = true
terminal-state-protocol = { path = "../terminal-state-protocol" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
