[package]
name = "terminal-core-ghostty-proof"
description = "Hermetic external libghostty-vt proof leaf for the Hmux TerminalCore bakeoff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
external-proof = []
supply-stage = [
    "dep:flate2",
    "dep:libc",
    "dep:sha2",
    "dep:tar",
    "dep:tempfile",
]

[dependencies]
flate2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true

[[bin]]
name = "stage-ghostty-vt"
path = "src/bin/stage_ghostty_vt.rs"
required-features = ["supply-stage"]

[build-dependencies]
cc = "1"
sha2.workspace = true
tempfile.workspace = true
